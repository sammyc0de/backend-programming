<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
	<head>
		<title>Books</title>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href=@{/css/bootstrap.min.css} />
	</head>
	<body>
        <h1>Books</h1>
	<div style="padding-bottom: 10px;"> Welcome
        <span sec:authentication="name">Name</span>
    </div>
    <div style="padding-bottom: 20px;"> 
		<form th:action="@{/logout}" method="post">
			<input type="submit" value="Sign Out" class="btn btn-sm btn-danger"/>
		</form>
    </div>
	
	
		
	</div>
    <table class="table table-striped">
        <tr>
            <th><b>Author</b></th>
			<th><b>Title</b></th>
			<th><b>ISBN</b></th>
			<th><b>Year</b></th>
            <th><b>Category</b></th>
            <th sec:authorize="hasRole('ADMIN')"> </th>
            <th></th>
            <th></th>
        </tr>
    
            <tr th:each="book : ${books}">
                <td th:text="${book.author}"></td>
                <td th:text="${book.title}"></td>
                <td th:text="${book.isbn}"></td>
                <td th:text="${book.publicationYear}"></td>
                <td th:text="${book.category.name}"></td>
                    <td sec:authorize="hasRole('ADMIN')"><td><a th:href="@{/delete/{id}(id=${book.id})}" class="btn btn-danger">Delete</a></td>
                <td><a th:href="@{/edit/{id}(id=${book.id})}" class="btn btn-primary">Edit</a></td>
            </tr>
        </table> 

	</body>
</html>
