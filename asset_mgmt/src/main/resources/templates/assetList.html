<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
	<head>
		<title>Asset management</title>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href=@{/css/bootstrap.min.css} />
	</head>
	<body>
    <div class="ms-3"> 
        <h1>Asset management</h1>	
        <a href="/add" class="btn btn-primary mb-3">Add asset</a>	
    <table class="table table-striped">
        <tr>
            <th><b>Vendor</b></th>
			<th><b>Model</b></th>
			<th><b>Description</b></th>
			<th><b>Operating System</b></th>
            <th><b>Hostname</b></th>
            <th><b>Category</b></th>
        </tr>    
            <tr th:each="asset : ${assets}">
            <td th:text="${asset.vendor}"></td>
            <td th:text="${asset.model}"></td>
            <td th:text="${asset.description}"></td>
            <td th:text="${asset.OS}"></td>
            <td th:text="${asset.hostname}"></td>
            <td th:text="${asset.category.name}"></td>
        </tr>
    </table> 
      
    </div>
	</body>
</html>
