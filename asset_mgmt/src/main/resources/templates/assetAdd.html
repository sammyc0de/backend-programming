<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
	<head>
		<title>Asset management</title>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href=@{/css/bootstrap.min.css} />
	</head>
	<body>
         <!--  styles by Bootstrap -->		
		<div class="ms-3">  <!-- left margin -->
        <h1>Add asset</h1>
   		<form th:object="${asset}" th:action="@{save}" action="#" method="post">        

            <div class="form-group mb-1">  <!-- bottom margin -->
                <label for="vendor">Vendor</label>      
                <input type="text" class="form-control w-25" placeholder="Enter vendor" id="vendor" th:field="*{vendor}">        
            </div>

            <div class="form-group mb-1">
                <label for="vendor">Model</label>      
                <input type="text" class="form-control w-25" placeholder="Enter model" id="model" th:field="*{model}">        
            </div>

            <div class="form-group mb-1">
                <label for="vendor">Description</label>      
                <input type="text" class="form-control w-25" placeholder="Enter description" id="description" th:field="*{description}">        
            </div>

            <div class="form-group mb-1">
                <label for="vendor">Operating system</label>      
                <input type="text" class="form-control w-25" placeholder="Enter operating system" id="OS" th:field="*{OS}">        
            </div>

            <div class="form-group mb-1">
                <label for="vendor">Hostname</label>      
                <input type="text" class="form-control w-25" placeholder="Enter hostname" id="hostname" th:field="*{hostname}">        
            </div>         

            <div class="form-group mb-1">
                <label for="category">Category</label>      
               	<select id="category" th:field="*{Category}" class="form-control w-25">

                    <option value="">-- Select Category --</option>

				    <option th:each="category: ${categories}"
                        th:value="${category.categoryid}"
                        th:text="${category.name}">
                    </option>
			    </select>    
            </div>  

        <div class="form-group mb-1">
            <span>Maintenance log:</span>    
        </div>

        <input type="hidden" th:field="*{maintenanceLog.maintenanceid}" />

        <div class="form-group mb-1">
            <label for="description">Performed maintenance</label>          
           <textarea th:field="*{maintenanceLog.description}" class="form-control w-25" rows="4"></textarea>
        </div> 

        <div class="form-group mb-1">
            <label for="date">Log updated last time (dd.mm.yyyy)</label>          
           <input type="text" th:field="*{maintenanceLog.date}" class="form-control w-25" />
        </div>
		
        </div>
        <div class="mt-3 ms-3">  <!-- top and left margin -->
            <button type="submit" value="Save" class="btn btn-primary">Submit</button>
        </div>           
	    </form>

	</body>
</html>
