<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"  xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6"></html>
	<head>
		<title>Asset management</title>
		<meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
        <link type="text/css" rel="stylesheet" href="/css/bootstrap.min.css" th:href=@{/css/bootstrap.min.css} />
	</head>
	<body>
        <!-- Thymelaeaf attributes: https://www.thymeleaf.org/doc/tutorials/2.1/usingthymeleaf.html, layouts: https://www.thymeleaf.org/doc/articles/layouts.html 
            Spring security dialects: https://www.thymeleaf.org/doc/articles/springsecurity.html        
        -->


	     <!--  styles by Bootstrap -->		
		<div class="ms-3">  <!-- left margin -->
         <td sec:authorize="hasAuthority('ADMIN')">
            <h1>Edit asset</h1>
        </td>
        <td sec:authorize="hasAuthority('USER')">
            <h1>View asset</h1>
        </td>
        
   		<form th:object="${asset}" th:action="@{../savechanges}" action="#" method="post">        

            <input type="hidden" th:field="*{id}" class="form-control"/>

            <div class="form-group mb-1">  <!-- bottom margin -->
                <label for="vendor">Vendor*</label>   
                <!-- Admins can edit-->
                <input type="text" class="form-control w-25" placeholder="Enter vendor" id="vendor" th:field="*{vendor}" sec:authorize="hasAuthority('ADMIN')">                    
                <!-- User can view-->
                <input type="text" class="form-control w-25" placeholder="Enter vendor" id="vendor" th:field="*{vendor}" sec:authorize="hasAuthority('USER')" readonly>       
                <span th:if="${#fields.hasErrors('vendor')}" th:errors="*{vendor}"  style="color:red"></span> 
            </div>

            <div class="form-group mb-1">
                <label for="vendor">Model*</label>
                <!-- Admins can edit-->     
                <input type="text" class="form-control w-25" placeholder="Enter model" id="model" th:field="*{model}" sec:authorize="hasAuthority('ADMIN')">      
                <!-- User can view-->
                <input type="text" class="form-control w-25" placeholder="Enter model" id="model" th:field="*{model}" sec:authorize="hasAuthority('USER')" readonly> 
                <span th:if="${#fields.hasErrors('model')}" th:errors="*{model}"  style="color:red"></span>    
            </div>

            <div class="form-group mb-1">
                <label for="vendor">Description*</label>      
                <!-- Admins can edit-->    
                <input type="text" class="form-control w-25" placeholder="Enter description" id="description" th:field="*{description}" sec:authorize="hasAuthority('ADMIN')">   
                <!-- User can view-->
                <input type="text" class="form-control w-25" placeholder="Enter description" id="description" th:field="*{description}" sec:authorize="hasAuthority('USER')" readonly>   
                <span th:if="${#fields.hasErrors('description')}" th:errors="*{description}"  style="color:red"></span>        
            </div>

            <div class="form-group mb-1">
                <label for="vendor">Operating system*</label>      
                <!-- Admins can edit--> 
                <input type="text" class="form-control w-25" placeholder="Enter operating system" id="OS" th:field="*{OS}" sec:authorize="hasAuthority('ADMIN')">   
                <!-- User can view-->
                <input type="text" class="form-control w-25" placeholder="Enter operating system" id="OS" th:field="*{OS}" sec:authorize="hasAuthority('USER')" readonly>
                <span th:if="${#fields.hasErrors('OS')}" th:errors="*{OS}"  style="color:red"></span>     
            </div>

            <div class="form-group mb-1">
                <label for="vendor">Hostname</label>      
                <!-- Admins can edit--> 
                <input type="text" class="form-control w-25" placeholder="Enter hostname" id="hostname" th:field="*{hostname}" sec:authorize="hasAuthority('ADMIN')"> 
                <!-- User can view-->
                <input type="text" class="form-control w-25" placeholder="Enter hostname" id="hostname" th:field="*{hostname}" sec:authorize="hasAuthority('USER')" readonly>
            </div>         

            <div class="form-group mb-2">
                <label for="category">Category*</label>      
               	<!-- Admins can edit--> 
                <select id="category" th:field="*{Category}" class="form-control w-25" sec:authorize="hasAuthority('ADMIN')">

                    <option value="">-- Select Category --</option>

				    <option th:each="category: ${categories}"
                        th:value="${category.categoryid}"
                        th:text="${category.name}">
                    </option>
			    </select>
                 <!-- User can view-->
                <select id="category" th:field="*{Category}" class="form-control w-25" sec:authorize="hasAuthority('USER')" disabled>

                    <option value="">-- Select Category --</option>

				    <option th:each="category: ${categories}"
                        th:value="${category.categoryid}"
                        th:text="${category.name}">
                    </option>
			    </select>   
                <span th:if="${#fields.hasErrors('category')}" th:errors="*{category}"  style="color:red"></span>
            </div>  
 

         <div class="form-group mb-1">
            <span>Maintenance log:</span>    
        </div>

        <input type="hidden" th:field="*{maintenanceLog.maintenanceid}" />

        <div class="form-group mb-1">
            <label for="description">Performed maintenance</label>
            <!-- Admins can edit--> 
           <textarea th:field="*{maintenanceLog.description}" class="form-control w-25" rows="4" sec:authorize="hasAuthority('ADMIN')"></textarea>
            <!-- User can view-->
           <textarea th:field="*{maintenanceLog.description}" class="form-control w-25" rows="4" sec:authorize="hasAuthority('USER')" readonly></textarea>

        </div> 

        <div class="form-group mb-1">
            <label for="date">Log updated last time (dd.mm.yyyy)</label>  
            <!-- Admins can edit--> 
           <input type="text" th:field="*{maintenanceLog.date}" class="form-control w-25" sec:authorize="hasAuthority('ADMIN')"/>
            <!-- User can view-->
           <input type="text" th:field="*{maintenanceLog.date}" class="form-control w-25" sec:authorize="hasAuthority('USER')" readonly/>
        </div>

        <div class="mt-3 ms-1">  <!-- top and left margin -->

        <span>* mandatory fields</span>
         
        <td sec:authorize="hasAuthority('ADMIN')">
            <button type="submit" value="Save" class="btn btn-primary">Save changes</button>
        </td>

         <td sec:authorize="hasAuthority('USER')">
            <a th:href="@{/}" class="btn btn-primary">Return to list</a>
        </td>

        </div>           
	    </form>

	</body>
</html>
